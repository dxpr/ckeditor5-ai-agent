name: Update Supported Models

on:
  # Temporary trigger for testing
  push:
    branches: 
      - 'syuzan/1.x/#109-refactor-ai-agent-to-support-multiple-llm-providers-using-multi-llm-ts/fix'
  
  # Final triggers
  schedule:
    - cron: '0 0 * * *'  # Runs daily at midnight UTC
  workflow_dispatch:  # Allows manual triggering

permissions:
  contents: write

jobs:
  update-models:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.1.1
        with:
          fetch-depth: 1
      
      - name: Setup Node.js
        uses: actions/setup-node@v4.0.2
        with:
          node-version: '22'
          
      - name: Install dependencies
        run: |
          npm install -g npm@latest
          npm install multi-llm-ts@latest
        
      - name: Update models
        id: update-models
        env:
          GOOGLE_GEMINI_API_KEY: ${{ secrets.GOOGLE_GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
        run: |
          node -e '
            const { loadModels } = require("multi-llm-ts");
            const fs = require("fs").promises;
            const path = require("path");
            
            async function updateModels() {
              console.log("Starting updateModels function");
              
              // Define dxai models as string literals
              const dxaiModels = ["kavya-m1", "kavya-m1-eu"];
              
              const modelsList = {
                // DXAI models are added manually as they are not part of multi-llm-ts
                dxai: dxaiModels
              };
              console.log("Initial modelsList:", JSON.stringify(modelsList, null, 2));
              let totalModels = modelsList.dxai.length;
              console.log("Initial totalModels:", totalModels);
              
              for (const [engine, config] of Object.entries({
                google: { apiKey: process.env.GOOGLE_GEMINI_API_KEY },
                openai: { apiKey: process.env.OPENAI_API_KEY },
                anthropic: { apiKey: process.env.ANTHROPIC_API_KEY },
                mistralai: { apiKey: process.env.MISTRAL_API_KEY },
                groq: { apiKey: process.env.GROQ_API_KEY },
                xai: { apiKey: process.env.XAI_API_KEY },
                openrouter: { }
              })) {
                try {
                  const models = await loadModels(engine, config);
                  if (models?.chat?.length) {
                    modelsList[engine] = models.chat.map(m => m.id);
                    totalModels += models.chat.length;
                  }
                } catch (error) {
                  console.warn(`Error loading ${engine} models:`, error.message);
                }
              }
              
              const filePath = "./SUPPORTED_MODELS.json";
              let shouldUpdate = true;
              
              try {
                const existingContent = await fs.readFile(filePath, "utf8");
                const existing = JSON.parse(existingContent);
                shouldUpdate = JSON.stringify(modelsList) !== JSON.stringify(existing);
              } catch (error) {
                // File does not exist or cannot be read, will create new
              }
              
              if (shouldUpdate) {
                await fs.writeFile(filePath, JSON.stringify(modelsList, null, 2) + "\n");
                
                // Update only the model count in README.md
                const readmePath = "./README.md";
                let readme = await fs.readFile(readmePath, "utf8");
                readme = readme.replace(
                  /<!-- BEGIN_MODEL_COUNT -->\d+<!-- END_MODEL_COUNT -->/,
                  `<!-- BEGIN_MODEL_COUNT -->${totalModels}<!-- END_MODEL_COUNT -->`
                );
                await fs.writeFile(readmePath, readme);
                
                // IMPORTANT: Do not change this syntax! The newer `$GITHUB_OUTPUT` syntax breaks the workflow
                // This specific syntax is required for the commit step condition to work
                console.log(`::set-output name=models_updated::true`);
              } else {
                console.log(`::set-output name=models_updated::false`);
              }
            }
            
            updateModels().catch(error => {
              console.error(error);
              process.exit(1);
            });
          '
          
      - name: Commit and push if changed
        if: steps.update-models.outputs.models_updated == 'true'
        run: |
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add SUPPORTED_MODELS.json README.md
          git commit -m "chore: update supported models and readme [skip ci]"
          git push